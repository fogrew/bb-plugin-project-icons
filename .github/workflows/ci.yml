name: CI

on:
  pull_request:
    branches: [develop, main, 'release/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: PR quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # No PR-controlled text is interpolated into shell commands.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Validate branch, commit range and manifest
        run: node scripts/check-quality.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, build and test
        env:
          BB_DATA_DIR: ${{ runner.temp }}/project-icons-build
        run: npm run check
      - name: Verify installation preserved the manifest and lockfile
        run: git diff --exit-code -- package.json package-lock.json
